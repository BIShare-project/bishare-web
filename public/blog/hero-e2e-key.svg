<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="The life of an encryption key, from generation on one device to scheduled destruction, told as a five-stage timeline">
  <defs>
    <linearGradient id="bg12" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14"/>
      <stop offset="1" stop-color="#0d1322"/>
    </linearGradient>
    <radialGradient id="glow12" cx="0.5" cy="0.45" r="0.62">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="life12" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="lb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3AA0FF"/><stop offset=".5" stop-color="#0A84FF"/><stop offset="1" stop-color="#0B3AD1"/>
    </linearGradient>
    <radialGradient id="lb-glow" cx=".5" cy=".36" r=".72">
      <stop offset="0" stop-color="#8FD0FF" stop-opacity=".5"/><stop offset="1" stop-color="#8FD0FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lb-mk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D6E9FF"/>
    </linearGradient>
    <radialGradient id="lb-nd" cx=".42" cy=".38" r=".7">
      <stop offset="0" stop-color="#F0FCFF"/><stop offset=".45" stop-color="#22D3EE"/><stop offset="1" stop-color="#0AACD0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg12)"/>
  <rect width="1200" height="630" fill="url(#glow12)"/>

  <g stroke="#ffffff" stroke-opacity="0.04">
    <path d="M0 105H1200M0 210H1200M0 315H1200M0 420H1200M0 525H1200"/>
    <path d="M150 0V630M300 0V630M450 0V630M600 0V630M750 0V630M900 0V630M1050 0V630"/>
  </g>

  <!-- the key itself, drawn large above the timeline -->
  <g transform="translate(600,170)">
    <circle cx="-96" cy="0" r="34" fill="none" stroke="#60a5fa" stroke-width="7"/>
    <circle cx="-96" cy="0" r="12" fill="#0d1322" stroke="#60a5fa" stroke-width="4"/>
    <path d="M-62 0 H118 M84 0 v26 M112 0 v20 M56 0 v18" stroke="#60a5fa" stroke-width="7" stroke-linecap="round" fill="none"/>
    <text y="-58" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#93c5fd" font-size="14">256 bits · generated on your device · held nowhere else</text>
  </g>

  <!-- life line -->
  <path d="M170 350 H1030" stroke="url(#life12)" stroke-width="4" stroke-linecap="round"/>

  <!-- stage 1: born -->
  <g transform="translate(220,350)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <circle r="26" fill="#0e1a2e" stroke="#3b82f6" stroke-width="2.5"/>
    <g fill="#93c5fd"><circle cx="-8" cy="-7" r="3"/><circle cx="7" cy="-2" r="3"/><circle cx="-3" cy="8" r="3"/><circle cx="9" cy="9" r="2.2"/><circle cx="-11" cy="4" r="2.2"/></g>
    <text y="52" text-anchor="middle" fill="#c7d6f2" font-size="14">born</text>
    <text y="72" text-anchor="middle" fill="#64748b" font-size="12">pure randomness</text>
  </g>

  <!-- stage 2: agreed -->
  <g transform="translate(410,350)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <circle r="26" fill="#0e1a2e" stroke="#3b82f6" stroke-width="2.5"/>
    <path d="M-13 -8 C -2 -8, 2 8, 13 8 M-13 8 C -2 8, 2 -8, 13 -8" stroke="#93c5fd" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <text y="52" text-anchor="middle" fill="#c7d6f2" font-size="14">agreed</text>
    <text y="72" text-anchor="middle" fill="#64748b" font-size="12">never transmitted</text>
  </g>

  <!-- stage 3: at work -->
  <g transform="translate(600,350)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <circle r="26" fill="#0e1a2e" stroke="#3b82f6" stroke-width="2.5"/>
    <rect x="-9" y="-4" width="18" height="14" rx="3" fill="none" stroke="#93c5fd" stroke-width="2.4"/>
    <path d="M-5 -4 v-5 a5 5 0 0 1 10 0 v5" fill="none" stroke="#93c5fd" stroke-width="2.4"/>
    <text y="52" text-anchor="middle" fill="#c7d6f2" font-size="14">at work</text>
    <text y="72" text-anchor="middle" fill="#64748b" font-size="12">seals + proves</text>
  </g>

  <!-- stage 4: proven -->
  <g transform="translate(790,350)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <circle r="26" fill="#0e1a2e" stroke="#3b82f6" stroke-width="2.5"/>
    <g fill="#93c5fd">
      <rect x="-11" y="-11" width="9" height="9" rx="1.5"/><rect x="2" y="-11" width="9" height="9" rx="1.5"/>
      <rect x="-11" y="2" width="9" height="9" rx="1.5"/><rect x="4" y="4" width="5" height="5" rx="1"/>
    </g>
    <text y="52" text-anchor="middle" fill="#c7d6f2" font-size="14">proven</text>
    <text y="72" text-anchor="middle" fill="#64748b" font-size="12">right endpoint</text>
  </g>

  <!-- stage 5: gone -->
  <g transform="translate(980,350)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <circle r="26" fill="#0e1a2e" stroke="#3b82f6" stroke-opacity="0.5" stroke-width="2.5" stroke-dasharray="5 5"/>
    <g fill="#64748b"><circle cx="-6" cy="-4" r="2.6"/><circle cx="6" cy="1" r="2"/><circle cx="0" cy="9" r="1.6"/><circle cx="10" cy="-9" r="1.3"/></g>
    <text y="52" text-anchor="middle" fill="#c7d6f2" font-size="14">gone</text>
    <text y="72" text-anchor="middle" fill="#64748b" font-size="12">forward secrecy</text>
  </g>

  <!-- devices flanking the line -->
  <g transform="translate(84,322)">
    <rect x="8" y="0" width="74" height="46" rx="6" fill="#0e1a2e" stroke="#3b82f6" stroke-opacity="0.55" stroke-width="2"/>
    <path d="M0 48h90l-7 8a7 7 0 0 1-5 2H12a7 7 0 0 1-5-2z" fill="#0b1424" stroke="#3b82f6" stroke-opacity="0.3"/>
  </g>
  <g transform="translate(1064,312)">
    <rect width="46" height="84" rx="10" fill="#0e1c30" stroke="#3b82f6" stroke-opacity="0.55" stroke-width="2"/>
    <rect x="7" y="12" width="32" height="52" rx="4" fill="#12253f"/>
  </g>

  <g font-family="Segoe UI, -apple-system, system-ui, sans-serif" text-anchor="middle">
    <text x="600" y="535" fill="#ffffff" font-size="38" font-weight="650" letter-spacing="-0.5">Follow the key, not the file</text>
    <text x="600" y="572" fill="#93a4c8" font-size="20">End-to-end encryption, told as a biography</text>
  </g>

  <!-- BIShare logo (inlined from public/logo.svg; ids prefixed) + wordmark -->
  <g transform="translate(70,44)" font-family="Segoe UI, -apple-system, system-ui, sans-serif">
    <g transform="scale(0.0664)">
      <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#lb-bg)"/>
      <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#lb-glow)"/>
      <rect x="16" y="16" width="480" height="220" rx="112" fill="#FFFFFF" opacity=".07"/>
      <g fill="none" stroke="url(#lb-mk)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round">
        <path d="M217.1 351.5 L351.5 217.1"/><path d="M316.1 223.3 L351.5 217.1 L345.3 252.6"/>
        <path d="M294.9 160.5 L160.5 294.9"/><path d="M195.9 288.7 L160.5 294.9 L166.7 259.5"/>
      </g>
      <circle cx="256" cy="256" r="18" fill="url(#lb-nd)"/>
    </g>
    <text x="44" y="25" fill="#dbe4f6" font-size="21" font-weight="600">BIShare</text>
  </g>
</svg>
