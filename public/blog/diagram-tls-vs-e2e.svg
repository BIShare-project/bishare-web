<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="Transport encryption decrypts at every server hop while end-to-end encryption keeps the file sealed from sender to recipient">
  <rect width="1200" height="420" fill="#0a1020"/>
  <g font-family="Segoe UI, -apple-system, system-ui, sans-serif">
    <text x="60" y="56" fill="#e8eefc" font-size="26" font-weight="650">The padlock is not the promise</text>
    <text x="60" y="118" fill="#fbbf24" font-size="16" font-weight="600">Transport encryption (HTTPS): protected per hop</text>
    <g font-size="14">
      <rect x="60" y="140" width="150" height="52" rx="8" fill="#131a2c" stroke="#334155"/>
      <text x="135" y="172" text-anchor="middle" fill="#e8eefc">You</text>
      <path d="M216 166 h74" stroke="#3b82f6" stroke-width="3"/>
      <rect x="296" y="140" width="180" height="52" rx="8" fill="#1a1410" stroke="#f59e0b" stroke-opacity="0.6"/>
      <text x="386" y="165" text-anchor="middle" fill="#fbbf24">your provider</text>
      <text x="386" y="184" text-anchor="middle" fill="#fbbf24" font-size="12.5" font-family="ui-monospace, Menlo, monospace">reads plaintext</text>
      <path d="M482 166 h74" stroke="#3b82f6" stroke-width="3"/>
      <rect x="562" y="140" width="180" height="52" rx="8" fill="#1a1410" stroke="#f59e0b" stroke-opacity="0.6"/>
      <text x="652" y="165" text-anchor="middle" fill="#fbbf24">their provider</text>
      <text x="652" y="184" text-anchor="middle" fill="#fbbf24" font-size="12.5" font-family="ui-monospace, Menlo, monospace">reads plaintext</text>
      <path d="M748 166 h74" stroke="#3b82f6" stroke-width="3"/>
      <rect x="828" y="140" width="150" height="52" rx="8" fill="#131a2c" stroke="#334155"/>
      <text x="903" y="172" text-anchor="middle" fill="#e8eefc">Recipient</text>
    </g>
    <text x="60" y="268" fill="#7fd6a0" font-size="16" font-weight="600">End-to-end encryption: sealed the whole way</text>
    <g font-size="14">
      <rect x="60" y="290" width="150" height="52" rx="8" fill="#131a2c" stroke="#334155"/>
      <text x="135" y="322" text-anchor="middle" fill="#e8eefc">You</text>
      <rect x="216" y="290" width="606" height="52" rx="26" fill="#0e1a2e" stroke="#22c55e" stroke-opacity="0.55" stroke-width="2"/>
      <text x="519" y="322" text-anchor="middle" fill="#7fd6a0" font-family="ui-monospace, Menlo, monospace">one sealed container — every hop carries ciphertext it cannot open</text>
      <rect x="828" y="290" width="150" height="52" rx="8" fill="#131a2c" stroke="#334155"/>
      <text x="903" y="322" text-anchor="middle" fill="#e8eefc">Recipient</text>
    </g>
  </g>
</svg>
