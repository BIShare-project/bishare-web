<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="The same high-res photo taking two journeys — one channel destroys it, one delivers it bit-for-bit">
  <defs>
    <linearGradient id="bg8" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b16"/>
      <stop offset="1" stop-color="#0d1424"/>
    </linearGradient>
    <radialGradient id="glow8" cx="0.5" cy="0.42" r="0.66">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.27"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="photo8" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#0e2a66"/>
    </linearGradient>
    <linearGradient id="lb-bg8" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3AA0FF"/><stop offset=".5" stop-color="#0A84FF"/><stop offset="1" stop-color="#0B3AD1"/>
    </linearGradient>
    <radialGradient id="lb-glow8" cx=".5" cy=".36" r=".72">
      <stop offset="0" stop-color="#8FD0FF" stop-opacity=".5"/><stop offset="1" stop-color="#8FD0FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lb-mk8" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D6E9FF"/>
    </linearGradient>
    <radialGradient id="lb-nd8" cx=".42" cy=".38" r=".7">
      <stop offset="0" stop-color="#F0FCFF"/><stop offset=".45" stop-color="#22D3EE"/><stop offset="1" stop-color="#0AACD0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg8)"/>
  <rect width="1200" height="630" fill="url(#glow8)"/>

  <g stroke="#ffffff" stroke-opacity="0.04">
    <path d="M0 105H1200M0 210H1200M0 315H1200M0 420H1200M0 525H1200"/>
    <path d="M150 0V630M300 0V630M450 0V630M600 0V630M750 0V630M900 0V630M1050 0V630"/>
  </g>

  <!-- original photo card -->
  <g transform="translate(150,200)">
    <rect width="230" height="200" rx="16" fill="#0e1a2e" stroke="#3b82f6" stroke-opacity="0.6" stroke-width="2.5"/>
    <g transform="translate(20,18)">
      <rect width="190" height="112" rx="10" fill="url(#photo8)"/>
      <circle cx="52" cy="34" r="14" fill="#facc15" opacity="0.9"/>
      <path d="M12 96 L62 52 L96 82 L124 60 L178 100 L178 104 q0 8 -8 8 H20 q-8 0 -8 -8 z" fill="#60a5fa" opacity="0.85"/>
    </g>
    <g font-family="Segoe UI, -apple-system, system-ui, sans-serif" text-anchor="middle">
      <text x="115" y="158" fill="#eaf2ff" font-size="16.5" font-weight="700">IMG_2041.heic</text>
      <text x="115" y="180" fill="#93c5fd" font-size="13.5">48 MP · 8064 × 6048</text>
    </g>
  </g>

  <!-- top journey: chat lane, degraded -->
  <g>
    <path d="M395 250 C 520 175, 700 165, 852 205" stroke="#f87171" stroke-opacity="0.5" stroke-width="4" fill="none" stroke-dasharray="12 10" stroke-linecap="round"/>
    <text x="610" y="158" fill="#fca5a5" font-size="14.5" font-family="Segoe UI, -apple-system, system-ui, sans-serif" text-anchor="middle" opacity="0.9">chat app photo lane</text>
    <g transform="translate(862,165)">
      <rect width="120" height="96" rx="12" fill="#1a1024" stroke="#f87171" stroke-opacity="0.55" stroke-width="2"/>
      <g transform="translate(16,12)">
        <rect width="88" height="42" rx="6" fill="#3f2450"/>
        <path d="M6 36 L28 20 L44 32 L56 24 L82 40 L82 40 q0 2 -2 2 H8 q-2 0 -2 -2 z" fill="#a78bbd" opacity="0.5"/>
        <circle cx="24" cy="14" r="5" fill="#d4c05a" opacity="0.5"/>
      </g>
      <g font-family="Segoe UI, -apple-system, system-ui, sans-serif" text-anchor="middle">
        <text x="60" y="74" fill="#fca5a5" font-size="12.5" font-weight="600">0.4 MP · re-encoded</text>
        <text x="60" y="89" fill="#7c6b8a" font-size="11">metadata gone</text>
      </g>
    </g>
    <g transform="translate(1000,158)">
      <circle cx="0" cy="0" r="13" fill="none" stroke="#f87171" stroke-width="2.5"/>
      <path d="M-5 -5 L5 5 M5 -5 L-5 5" stroke="#f87171" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- bottom journey: local direct, intact -->
  <g>
    <path d="M395 350 C 520 425, 700 435, 852 395" stroke="#3b82f6" stroke-opacity="0.55" stroke-width="4" fill="none" stroke-dasharray="13 11" stroke-linecap="round"/>
    <text x="610" y="465" fill="#93c5fd" font-size="14.5" font-family="Segoe UI, -apple-system, system-ui, sans-serif" text-anchor="middle">local direct transfer</text>
    <g fill="#60a5fa">
      <rect x="520" y="384" width="26" height="20" rx="5"/>
      <rect x="606" y="396" width="26" height="20" rx="5" opacity="0.85"/>
      <rect x="694" y="398" width="26" height="20" rx="5" opacity="0.7"/>
    </g>
    <g transform="translate(862,300)">
      <rect width="188" height="164" rx="14" fill="#0e1a2e" stroke="#3b82f6" stroke-opacity="0.6" stroke-width="2.5"/>
      <g transform="translate(17,15)">
        <rect width="154" height="90" rx="8" fill="url(#photo8)"/>
        <circle cx="42" cy="27" r="11" fill="#facc15" opacity="0.9"/>
        <path d="M10 77 L50 42 L78 66 L100 48 L144 80 L144 84 q0 6 -6 6 H16 q-6 0 -6 -6 z" fill="#60a5fa" opacity="0.85"/>
      </g>
      <g font-family="Segoe UI, -apple-system, system-ui, sans-serif" text-anchor="middle">
        <text x="80" y="130" fill="#eaf2ff" font-size="14.5" font-weight="700">48 MP · bit-for-bit</text>
        <text x="80" y="149" fill="#64748b" font-size="12">HEIC + metadata intact</text>
      </g>
      <g transform="translate(160,138)">
        <circle cx="0" cy="0" r="13" fill="none" stroke="#22c55e" stroke-width="2.5"/>
        <path d="M-6 0 l4 5 8 -10" stroke="#22c55e" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
  </g>

  <g font-family="Segoe UI, -apple-system, system-ui, sans-serif" text-anchor="middle">
    <text x="600" y="540" fill="#ffffff" font-size="38" font-weight="650" letter-spacing="-0.5">Same photo, two journeys</text>
    <text x="600" y="577" fill="#93a4c8" font-size="20">The channel decides what survives — not your camera</text>
  </g>

  <!-- BIShare logo (inlined from public/logo.svg; ids prefixed) + wordmark -->
  <g transform="translate(548,52)" font-family="Segoe UI, -apple-system, system-ui, sans-serif">
    <g transform="scale(0.0664)">
      <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#lb-bg8)"/>
      <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#lb-glow8)"/>
      <rect x="16" y="16" width="480" height="220" rx="112" fill="#FFFFFF" opacity=".07"/>
      <g fill="none" stroke="url(#lb-mk8)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round">
        <path d="M217.1 351.5 L351.5 217.1"/><path d="M316.1 223.3 L351.5 217.1 L345.3 252.6"/>
        <path d="M294.9 160.5 L160.5 294.9"/><path d="M195.9 288.7 L160.5 294.9 L166.7 259.5"/>
      </g>
      <circle cx="256" cy="256" r="18" fill="url(#lb-nd8)"/>
    </g>
    <text x="44" y="25" fill="#dbe4f6" font-size="21" font-weight="600">BIShare</text>
  </g>
</svg>
