<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-label="Three routes for moving a 5 GB video from Android to a Mac, compared by time and quality">
  <rect width="1200" height="430" fill="#0a1020"/>
  <g font-family="Segoe UI, -apple-system, system-ui, sans-serif">
    <text x="60" y="58" fill="#e8eefc" font-size="26" font-weight="650">Moving a 5 GB video: Android → Mac</text>
    <text x="60" y="88" fill="#93a4c8" font-size="15">Same file, three routes. Bar length = time until the Mac has it.</text>
    <rect x="60" y="130" width="700" height="34" rx="6" fill="#3b82f6" fill-opacity="1"/>
    <text x="775" y="153" fill="#93c5fd" font-size="15" font-family="ui-monospace, Menlo, monospace">~2 min · original quality</text>
    <text x="60" y="122" fill="#e8eefc" font-size="15" font-weight="600">Direct over Wi-Fi</text>
    <rect x="60" y="222" width="180" height="34" rx="6" fill="#3b82f6" fill-opacity="0.55"/>
    <text x="255" y="245" fill="#93c5fd" font-size="15" font-family="ui-monospace, Menlo, monospace">~2 min · no install on the Mac</text>
    <text x="60" y="214" fill="#e8eefc" font-size="15" font-weight="600">Browser link (same network)</text>
    <rect x="60" y="314" width="1080" height="34" rx="6" fill="#64748b" fill-opacity="0.5"/>
    <text x="60" y="306" fill="#e8eefc" font-size="15" font-weight="600">Cloud upload, then download</text>
    <text x="60" y="382" fill="#fbbf24" font-size="15" font-family="ui-monospace, Menlo, monospace">~25 min on a 30 Mbps upload — and Storage-saver settings may recompress the video</text>
  </g>
</svg>
