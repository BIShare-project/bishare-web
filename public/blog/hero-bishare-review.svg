<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="A self-review that opens with its own weaknesses: a scorecard listing what is solid, what is young, and what is missing">
  <defs>
    <linearGradient id="bg16" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14"/><stop offset="1" stop-color="#0d1322"/>
    </linearGradient>
    <radialGradient id="glow16" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.22"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3AA0FF"/><stop offset=".5" stop-color="#0A84FF"/><stop offset="1" stop-color="#0B3AD1"/>
    </linearGradient>
    <radialGradient id="lb-glow" cx=".5" cy=".36" r=".72">
      <stop offset="0" stop-color="#8FD0FF" stop-opacity=".5"/><stop offset="1" stop-color="#8FD0FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lb-mk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D6E9FF"/>
    </linearGradient>
    <radialGradient id="lb-nd" cx=".42" cy=".38" r=".7">
      <stop offset="0" stop-color="#F0FCFF"/><stop offset=".45" stop-color="#22D3EE"/><stop offset="1" stop-color="#0AACD0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg16)"/>
  <rect width="1200" height="630" fill="url(#glow16)"/>
  <g stroke="#ffffff" stroke-opacity="0.04">
    <path d="M0 105H1200M0 210H1200M0 315H1200M0 420H1200M0 525H1200"/>
    <path d="M150 0V630M300 0V630M450 0V630M600 0V630M750 0V630M900 0V630M1050 0V630"/>
  </g>
  <g font-family="Segoe UI, -apple-system, system-ui, sans-serif">
    <text x="600" y="146" text-anchor="middle" fill="#93a4c8" font-size="17">Written by the people who built it — so it starts with the flaws</text>

    <g transform="translate(190,190)">
      <rect width="360" height="238" rx="18" fill="#160f0c" stroke="#f59e0b" stroke-opacity="0.45" stroke-width="2"/>
      <text x="180" y="46" text-anchor="middle" fill="#fbbf24" font-size="17" font-weight="600">don't use it if…</text>
      <g font-size="14.5" fill="#93a4c8">
        <text x="30" y="90">you're all-Apple already</text>
        <text x="30" y="124">you need signed Windows binaries</text>
        <text x="30" y="158">you want a Mac app outside the store</text>
        <text x="30" y="192">your circle already uses something else</text>
      </g>
    </g>

    <g transform="translate(650,190)">
      <rect width="360" height="238" rx="18" fill="#0c1830" stroke="#3b82f6" stroke-opacity="0.55" stroke-width="2"/>
      <text x="180" y="46" text-anchor="middle" fill="#93c5fd" font-size="17" font-weight="600">check it yourself</text>
      <g font-size="14.5" fill="#e8eefc">
        <text x="30" y="90">40–50 MB/s — time a 1 GB file</text>
        <text x="30" y="124">no install needed on one side</text>
        <text x="30" y="158">works with no internet at all</text>
        <text x="30" y="192">one Rust crypto core, public</text>
      </g>
    </g>

    <text x="600" y="536" text-anchor="middle" fill="#ffffff" font-size="37" font-weight="650" letter-spacing="-0.5">A review you can go and falsify</text>
    <text x="600" y="574" text-anchor="middle" fill="#93a4c8" font-size="19">BIShare, reviewed by its makers — flaws first</text>
  </g>
  <g transform="translate(70,44)" font-family="Segoe UI, -apple-system, system-ui, sans-serif">
    <g transform="scale(0.0664)">
      <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#lb-bg)"/>
      <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#lb-glow)"/>
      <rect x="16" y="16" width="480" height="220" rx="112" fill="#FFFFFF" opacity=".07"/>
      <g fill="none" stroke="url(#lb-mk)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round">
        <path d="M217.1 351.5 L351.5 217.1"/><path d="M316.1 223.3 L351.5 217.1 L345.3 252.6"/>
        <path d="M294.9 160.5 L160.5 294.9"/><path d="M195.9 288.7 L160.5 294.9 L166.7 259.5"/>
      </g>
      <circle cx="256" cy="256" r="18" fill="url(#lb-nd)"/>
    </g>
    <text x="44" y="25" fill="#dbe4f6" font-size="21" font-weight="600">BIShare</text>
  </g>
</svg>
