<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-label="An Android phone running a WebDAV server appearing as a mounted drive in the Mac Finder over the local network">
  <rect width="1200" height="400" fill="#0a1020"/>
  <g font-family="Segoe UI, -apple-system, system-ui, sans-serif">
    <text x="60" y="56" fill="#e8eefc" font-size="26" font-weight="650">WebDAV: the phone becomes a drive</text>
    <g transform="translate(120,120)">
      <rect width="120" height="210" rx="18" fill="#0e1c30" stroke="#3b82f6" stroke-opacity="0.6" stroke-width="2"/>
      <rect x="14" y="30" width="92" height="130" rx="8" fill="#12253f"/>
      <text x="60" y="100" text-anchor="middle" fill="#93c5fd" font-size="13" font-family="ui-monospace, Menlo, monospace">WebDAV</text>
      <text x="60" y="122" text-anchor="middle" fill="#93c5fd" font-size="13" font-family="ui-monospace, Menlo, monospace">server</text>
      <text x="60" y="196" text-anchor="middle" fill="#e8eefc" font-size="14">Android</text>
    </g>
    <g>
      <path d="M280 225 H820" stroke="#3b82f6" stroke-width="3" stroke-dasharray="10 8"/>
      <text x="550" y="205" text-anchor="middle" fill="#93c5fd" font-size="14" font-family="ui-monospace, Menlo, monospace">http://192.168.1.42:8080</text>
      <text x="550" y="255" text-anchor="middle" fill="#64748b" font-size="14">same Wi-Fi · no cloud account</text>
    </g>
    <g transform="translate(840,140)">
      <rect x="10" y="0" width="230" height="140" rx="10" fill="#0e1a2e" stroke="#3b82f6" stroke-opacity="0.6" stroke-width="2"/>
      <rect x="22" y="12" width="206" height="116" rx="6" fill="#12253f"/>
      <text x="125" y="62" text-anchor="middle" fill="#e8eefc" font-size="14">Finder → Connect to Server</text>
      <text x="125" y="88" text-anchor="middle" fill="#7fd6a0" font-size="13" font-family="ui-monospace, Menlo, monospace">mounted as a volume</text>
      <path d="M0 142h250l-12 14a10 10 0 0 1-8 4H20a10 10 0 0 1-8-4z" fill="#0b1424" stroke="#3b82f6" stroke-opacity="0.35"/>
      <text x="125" y="188" text-anchor="middle" fill="#e8eefc" font-size="14">Mac</text>
    </g>
  </g>
</svg>
