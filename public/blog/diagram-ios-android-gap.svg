<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-label="AirDrop and Quick Share each stop at their own ecosystem, with BIShare bridging the gap between iPhone and Android">
  <rect width="1200" height="400" fill="#0a1020"/>
  <g font-family="Segoe UI, -apple-system, system-ui, sans-serif">
    <text x="60" y="56" fill="#e8eefc" font-size="26" font-weight="650">The gap between two walled gardens</text>
    <ellipse cx="290" cy="220" rx="200" ry="105" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-opacity="0.5" stroke-width="2"/>
    <text x="290" y="180" text-anchor="middle" fill="#93c5fd" font-size="16" font-weight="600">AirDrop</text>
    <text x="290" y="212" text-anchor="middle" fill="#e8eefc" font-size="15">iPhone · iPad · Mac</text>
    <text x="290" y="242" text-anchor="middle" fill="#64748b" font-size="14">Apple devices only</text>
    <ellipse cx="910" cy="220" rx="200" ry="105" fill="#22c55e" fill-opacity="0.07" stroke="#22c55e" stroke-opacity="0.45" stroke-width="2"/>
    <text x="910" y="180" text-anchor="middle" fill="#7fd6a0" font-size="16" font-weight="600">Quick Share</text>
    <text x="910" y="212" text-anchor="middle" fill="#e8eefc" font-size="15">Android · Windows</text>
    <text x="910" y="242" text-anchor="middle" fill="#64748b" font-size="14">no iPhone support</text>
    <path d="M492 220 H708" stroke="#64748b" stroke-width="2" stroke-dasharray="6 8"/>
    <text x="600" y="205" text-anchor="middle" fill="#f87171" font-size="15">they never meet</text>
    <rect x="470" y="316" width="260" height="50" rx="25" fill="#0e1a2e" stroke="#60a5fa" stroke-width="2"/>
    <text x="600" y="347" text-anchor="middle" fill="#e8eefc" font-size="15" font-weight="600">BIShare spans both</text>
    <path d="M290 300 Q 420 380 470 344 M910 300 Q 780 380 730 344" stroke="#60a5fa" stroke-width="2" fill="none" stroke-opacity="0.7"/>
  </g>
</svg>
