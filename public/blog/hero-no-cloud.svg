<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Transferring large files directly between devices, bypassing the cloud detour">
  <defs>
    <linearGradient id="bg10" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14"/>
      <stop offset="1" stop-color="#0d1322"/>
    </linearGradient>
    <radialGradient id="glow10" cx="0.5" cy="0.55" r="0.6">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="direct" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="0.5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="lb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3AA0FF"/><stop offset=".5" stop-color="#0A84FF"/><stop offset="1" stop-color="#0B3AD1"/>
    </linearGradient>
    <radialGradient id="lb-glow" cx=".5" cy=".36" r=".72">
      <stop offset="0" stop-color="#8FD0FF" stop-opacity=".5"/><stop offset="1" stop-color="#8FD0FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lb-mk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D6E9FF"/>
    </linearGradient>
    <radialGradient id="lb-nd" cx=".42" cy=".38" r=".7">
      <stop offset="0" stop-color="#F0FCFF"/><stop offset=".45" stop-color="#22D3EE"/><stop offset="1" stop-color="#0AACD0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg10)"/>
  <rect width="1200" height="630" fill="url(#glow10)"/>

  <g stroke="#ffffff" stroke-opacity="0.04">
    <path d="M0 105H1200M0 210H1200M0 315H1200M0 420H1200M0 525H1200"/>
    <path d="M150 0V630M300 0V630M450 0V630M600 0V630M750 0V630M900 0V630M1050 0V630"/>
  </g>

  <!-- the long cloud detour (faded, dashed, with distance label) -->
  <g opacity="0.5">
    <path d="M310 330 C 380 140, 820 140, 890 330" stroke="#94a3b8" stroke-width="3" fill="none" stroke-dasharray="8 9" stroke-linecap="round"/>
    <g transform="translate(600,128)">
      <path d="M-52 18 a22 22 0 0 1 8 -42 a30 30 0 0 1 57 -8 a24 24 0 0 1 39 20 a19 19 0 0 1 -6 30 z" fill="#1b2740" stroke="#94a3b8" stroke-opacity="0.6" stroke-width="2.5"/>
      <text y="8" text-anchor="middle" font-family="Segoe UI, -apple-system, system-ui, sans-serif" fill="#94a3b8" font-size="14">quota · queue · custody</text>
    </g>
    <text x="600" y="205" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#64748b" font-size="13">~3,000 km · upload + download · your plan's limit</text>
  </g>

  <!-- laptop left -->
  <g transform="translate(150,300)">
    <rect x="8" y="0" width="200" height="122" rx="10" fill="#0e1a2e" stroke="#3b82f6" stroke-opacity="0.6" stroke-width="2.5"/>
    <rect x="20" y="11" width="176" height="100" rx="6" fill="#12253f"/>
    <path d="M0 124h216l-11 13a10 10 0 0 1-8 3H19a10 10 0 0 1-8-3z" fill="#0b1424" stroke="#3b82f6" stroke-opacity="0.35"/>
    <text x="108" y="70" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#93c5fd" font-size="15">86 GB</text>
  </g>

  <!-- phone right -->
  <g transform="translate(905,268)">
    <rect width="120" height="220" rx="20" fill="#0e1c30" stroke="#3b82f6" stroke-opacity="0.6" stroke-width="2.5"/>
    <rect x="14" y="34" width="92" height="128" rx="9" fill="#12253f"/>
    <circle cx="60" cy="98" r="24" fill="#22c55e" fill-opacity="0.14" stroke="#22c55e" stroke-opacity="0.6" stroke-width="2"/>
    <path d="M52 98 l6 6 12 -13" stroke="#22c55e" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="60" y="192" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#7fd6a0" font-size="12.5">arriving…</text>
  </g>

  <!-- the direct beam (thick, bright, short) -->
  <g>
    <path d="M372 372 L898 372" stroke="url(#direct)" stroke-width="9" stroke-linecap="round"/>
    <path d="M372 372 L898 372" stroke="#93c5fd" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 26"/>
    <path d="M886 372 l-16 -10 v20 z" fill="#93c5fd"/>
    <text x="600" y="405" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#93c5fd" font-size="13.5">9 meters · one hop · no quota</text>
  </g>

  <g font-family="Segoe UI, -apple-system, system-ui, sans-serif" text-anchor="middle">
    <text x="600" y="535" fill="#ffffff" font-size="38" font-weight="650" letter-spacing="-0.5">Your file doesn't need a passport</text>
    <text x="600" y="572" fill="#93a4c8" font-size="20">Instant, unlimited transfer — the case against the cloud detour</text>
  </g>

  <!-- BIShare logo (inlined from public/logo.svg; ids prefixed) + wordmark -->
  <g transform="translate(70,44)" font-family="Segoe UI, -apple-system, system-ui, sans-serif">
    <g transform="scale(0.0664)">
      <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#lb-bg)"/>
      <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#lb-glow)"/>
      <rect x="16" y="16" width="480" height="220" rx="112" fill="#FFFFFF" opacity=".07"/>
      <g fill="none" stroke="url(#lb-mk)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round">
        <path d="M217.1 351.5 L351.5 217.1"/><path d="M316.1 223.3 L351.5 217.1 L345.3 252.6"/>
        <path d="M294.9 160.5 L160.5 294.9"/><path d="M195.9 288.7 L160.5 294.9 L166.7 259.5"/>
      </g>
      <circle cx="256" cy="256" r="18" fill="url(#lb-nd)"/>
    </g>
    <text x="44" y="25" fill="#dbe4f6" font-size="21" font-weight="600">BIShare</text>
  </g>
</svg>
