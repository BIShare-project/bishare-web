<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-label="Seven jobs a SHAREit replacement has to cover, from offline transfer to app sharing, group sending and where received files land">
  <rect width="1200" height="430" fill="#0a1020"/>
  <g font-family="Segoe UI, -apple-system, system-ui, sans-serif">
    <text x="60" y="56" fill="#e8eefc" font-size="26" font-weight="650">The seven jobs you are actually replacing</text>
    <text x="60" y="86" fill="#93a4c8" font-size="15">Only two of them are "transfer" in the narrow sense — which is why speed comparisons mislead.</text>
    <g font-size="15">
      <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#60a5fa" font-size="14">
        <text x="66" y="146">01</text><text x="66" y="186">02</text><text x="66" y="226">03</text><text x="66" y="266">04</text>
        <text x="646" y="146">05</text><text x="646" y="186">06</text><text x="646" y="226">07</text>
      </g>
      <text x="112" y="146" fill="#e8eefc">Offline phone-to-phone</text>
      <text x="112" y="186" fill="#e8eefc">Android ↔ iPhone</text>
      <text x="112" y="226" fill="#e8eefc">Sharing installed apps</text>
      <text x="112" y="266" fill="#e8eefc">Group sending</text>
      <text x="692" y="146" fill="#e8eefc">Receiver has no app</text>
      <text x="692" y="186" fill="#e8eefc">No size ceiling</text>
      <text x="692" y="226" fill="#e8eefc">Inbox &amp; history</text>
      <g fill="#64748b" font-size="13.5">
        <text x="112" y="166">no data, no router needed</text>
        <text x="112" y="206">the gap AirDrop and Quick Share leave</text>
        <text x="112" y="246">needs scoped package visibility</text>
        <text x="112" y="286">one sender, several receivers</text>
        <text x="692" y="166">the one that removes the convincing</text>
        <text x="692" y="206">movies, not documents</text>
        <text x="692" y="246">findable a week later</text>
      </g>
    </g>
    <path d="M60 316 H1140" stroke="#1e2c48"/>
    <text x="60" y="354" fill="#93c5fd" font-size="15">Test any candidate against all seven — the one you forget is the one that sends you back.</text>
    <text x="60" y="386" fill="#64748b" font-size="14">Jobs 1 and 6 are about throughput. The other five decide whether you keep using it.</text>
  </g>
</svg>
