<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-label="An honest scorecard of BIShare by platform: iOS, Android, macOS and the browser path are well exercised, Windows is young and unsigned, Linux is least field-tested, and there is no third-party security audit yet">
  <rect width="1200" height="470" fill="#0a1020"/>
  <g font-family="Segoe UI, -apple-system, system-ui, sans-serif">
    <text x="60" y="56" fill="#e8eefc" font-size="26" font-weight="650">An honest scorecard</text>
    <text x="60" y="86" fill="#93a4c8" font-size="15">Same codebase everywhere — but not the same amount of time in real users' hands.</text>

    <g font-size="15">
      <text x="60" y="140" fill="#7fd6a0" font-size="16" font-weight="600">Well exercised</text>
      <g fill="#e8eefc">
        <text x="60" y="174">iOS</text><text x="200" y="174">Android</text><text x="360" y="174">macOS</text><text x="520" y="174">Browser path</text>
      </g>
      <g fill="#64748b" font-size="13.5">
        <text x="60" y="196">store build</text><text x="200" y="196">store build</text><text x="360" y="196">App Store only</text><text x="520" y="196">nothing to install</text>
      </g>

      <text x="60" y="254" fill="#fbbf24" font-size="16" font-weight="600">Young</text>
      <text x="60" y="288" fill="#e8eefc">Windows</text>
      <text x="200" y="288" fill="#fbbf24" font-size="13.5">unsigned ZIP — SmartScreen will warn; least time in the field</text>

      <text x="60" y="346" fill="#f59e0b" font-size="16" font-weight="600">Least tested</text>
      <text x="60" y="380" fill="#e8eefc">Linux</text>
      <text x="200" y="380" fill="#93a4c8" font-size="13.5">tar.gz · .deb · AppImage — builds and ships, fewest users running it</text>
    </g>

    <path d="M60 412 H1140" stroke="#1e2c48"/>
    <text x="60" y="444" fill="#f87171" font-size="14.5">Not yet: signed Windows binaries · notarized Mac DMG · F-Droid listing · third-party security audit</text>
  </g>
</svg>
