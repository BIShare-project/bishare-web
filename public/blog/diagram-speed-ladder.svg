<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" role="img" aria-label="Realistic transfer speeds by link type, from 2.4 GHz Wi-Fi taking minutes to gigabit Ethernet moving a gigabyte in nine seconds">
  <rect width="1200" height="450" fill="#0a1020"/>
  <g font-family="Segoe UI, -apple-system, system-ui, sans-serif">
    <text x="60" y="54" fill="#e8eefc" font-size="26" font-weight="650">What your link can actually deliver</text>
    <text x="60" y="84" fill="#93a4c8" font-size="15">Realistic throughput, not the number on the router box. Bar length = speed.</text>
    <g font-size="15">
      <text x="60" y="140" fill="#e8eefc">Wi-Fi 2.4 GHz</text>
      <rect x="330" y="122" width="55" height="26" rx="5" fill="#ef4444" fill-opacity="0.6"/>
      <text x="400" y="141" fill="#f87171" font-family="ui-monospace, Menlo, monospace">3–8 MB/s · 1 GB in 2–5 min</text>

      <text x="60" y="196" fill="#e8eefc">Wi-Fi 5 on 5 GHz</text>
      <rect x="330" y="178" width="330" height="26" rx="5" fill="#3b82f6"/>
      <text x="675" y="197" fill="#93c5fd" font-family="ui-monospace, Menlo, monospace">40–50 MB/s · 1 GB in 20–30 s</text>

      <text x="60" y="252" fill="#e8eefc">Wi-Fi 6, close range</text>
      <rect x="330" y="234" width="640" height="26" rx="5" fill="#22d3ee" fill-opacity="0.85"/>
      <text x="985" y="253" fill="#7fd6a0" font-family="ui-monospace, Menlo, monospace">70–110 MB/s</text>

      <text x="60" y="308" fill="#e8eefc">PC on Ethernet, phone Wi-Fi</text>
      <rect x="330" y="290" width="440" height="26" rx="5" fill="#3b82f6" fill-opacity="0.8"/>
      <text x="785" y="309" fill="#93c5fd" font-family="ui-monospace, Menlo, monospace">50–70 MB/s</text>

      <text x="60" y="364" fill="#e8eefc">Both on Gigabit Ethernet</text>
      <rect x="330" y="346" width="700" height="26" rx="5" fill="#22c55e" fill-opacity="0.75"/>
      <text x="1045" y="365" fill="#7fd6a0" font-family="ui-monospace, Menlo, monospace">110 MB/s</text>
    </g>
    <text x="60" y="418" fill="#64748b" font-size="14">The band matters more than almost anything else — and a phone drops to 2.4 GHz on its own when the signal weakens.</text>
  </g>
</svg>
