<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="A ladder of disconnection: five rungs from ordinary Wi-Fi down to a fully air-gapped screen-to-camera transfer">
  <defs>
    <linearGradient id="bg13" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14"/>
      <stop offset="1" stop-color="#0d1322"/>
    </linearGradient>
    <radialGradient id="glow13" cx="0.5" cy="0.5" r="0.62">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rung13" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="lb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3AA0FF"/><stop offset=".5" stop-color="#0A84FF"/><stop offset="1" stop-color="#0B3AD1"/>
    </linearGradient>
    <radialGradient id="lb-glow" cx=".5" cy=".36" r=".72">
      <stop offset="0" stop-color="#8FD0FF" stop-opacity=".5"/><stop offset="1" stop-color="#8FD0FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lb-mk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D6E9FF"/>
    </linearGradient>
    <radialGradient id="lb-nd" cx=".42" cy=".38" r=".7">
      <stop offset="0" stop-color="#F0FCFF"/><stop offset=".45" stop-color="#22D3EE"/><stop offset="1" stop-color="#0AACD0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg13)"/>
  <rect width="1200" height="630" fill="url(#glow13)"/>

  <g stroke="#ffffff" stroke-opacity="0.04">
    <path d="M0 105H1200M0 210H1200M0 315H1200M0 420H1200M0 525H1200"/>
    <path d="M150 0V630M300 0V630M450 0V630M600 0V630M750 0V630M900 0V630M1050 0V630"/>
  </g>

  <!-- the ladder: five rungs, each narrower in exposure as you descend -->
  <g font-family="Segoe UI, -apple-system, system-ui, sans-serif">
    <!-- rails -->
    <path d="M300 150 V500 M900 150 V500" stroke="#1e2c48" stroke-width="3"/>

    <!-- rung 1 -->
    <g transform="translate(0,168)">
      <path d="M300 0 H900" stroke="url(#rung13)" stroke-width="4" stroke-opacity="0.55"/>
      <text x="284" y="5" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#60a5fa" font-size="15">01</text>
      <text x="320" y="-10" fill="#e8eefc" font-size="17" font-weight="600">Your own Wi-Fi</text>
      <text x="916" y="5" fill="#64748b" font-size="13.5">router log only</text>
    </g>

    <!-- rung 2 -->
    <g transform="translate(0,251)">
      <path d="M300 0 H900" stroke="url(#rung13)" stroke-width="4" stroke-opacity="0.65"/>
      <text x="284" y="5" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#60a5fa" font-size="15">02</text>
      <text x="320" y="-10" fill="#e8eefc" font-size="17" font-weight="600">Shared / public Wi-Fi</text>
      <text x="916" y="5" fill="#64748b" font-size="13.5">operator sees shape</text>
    </g>

    <!-- rung 3 -->
    <g transform="translate(0,334)">
      <path d="M300 0 H900" stroke="url(#rung13)" stroke-width="4" stroke-opacity="0.8"/>
      <text x="284" y="5" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#60a5fa" font-size="15">03</text>
      <text x="320" y="-10" fill="#e8eefc" font-size="17" font-weight="600">Your phone's hotspot</text>
      <text x="916" y="5" fill="#7fd6a0" font-size="13.5">nobody else present</text>
    </g>

    <!-- rung 4 -->
    <g transform="translate(0,417)">
      <path d="M300 0 H900" stroke="url(#rung13)" stroke-width="4" stroke-opacity="0.9"/>
      <text x="284" y="5" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#60a5fa" font-size="15">04</text>
      <text x="320" y="-10" fill="#e8eefc" font-size="17" font-weight="600">Locked-down site · browser</text>
      <text x="916" y="5" fill="#64748b" font-size="13.5">no install needed</text>
    </g>

    <!-- rung 5 -->
    <g transform="translate(0,500)">
      <path d="M300 0 H900" stroke="url(#rung13)" stroke-width="4"/>
      <text x="284" y="5" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#22d3ee" font-size="15">05</text>
      <text x="320" y="-10" fill="#e8eefc" font-size="17" font-weight="600">No radios · screen → camera</text>
      <text x="916" y="5" fill="#7fd6a0" font-size="13.5">nothing transmitted</text>
    </g>
  </g>

  <!-- descending arrow along the ladder -->
  <g>
    <path d="M256 150 V492" stroke="#1e2c48" stroke-width="2" stroke-dasharray="4 7"/>
    <path d="M256 500 l-7 -12 h14 z" fill="#22d3ee"/>
    <text x="238" y="330" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#475569" font-size="12" transform="rotate(-90 238 330)">fewer observers</text>
  </g>

  <g font-family="Segoe UI, -apple-system, system-ui, sans-serif" text-anchor="middle">
    <text x="600" y="576" fill="#ffffff" font-size="37" font-weight="650" letter-spacing="-0.5">The internet is a strange way to cross a room</text>
  </g>

  <!-- BIShare logo (inlined from public/logo.svg; ids prefixed) + wordmark -->
  <g transform="translate(70,44)" font-family="Segoe UI, -apple-system, system-ui, sans-serif">
    <g transform="scale(0.0664)">
      <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#lb-bg)"/>
      <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#lb-glow)"/>
      <rect x="16" y="16" width="480" height="220" rx="112" fill="#FFFFFF" opacity=".07"/>
      <g fill="none" stroke="url(#lb-mk)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round">
        <path d="M217.1 351.5 L351.5 217.1"/><path d="M316.1 223.3 L351.5 217.1 L345.3 252.6"/>
        <path d="M294.9 160.5 L160.5 294.9"/><path d="M195.9 288.7 L160.5 294.9 L166.7 259.5"/>
      </g>
      <circle cx="256" cy="256" r="18" fill="url(#lb-nd)"/>
    </g>
    <text x="44" y="25" fill="#dbe4f6" font-size="21" font-weight="600">BIShare</text>
  </g>
</svg>
