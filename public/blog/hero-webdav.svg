<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="A Mac serving a folder over WebDAV to an Android phone">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070c18"/>
      <stop offset="1" stop-color="#0c1526"/>
    </linearGradient>
    <radialGradient id="glow5" cx="0.42" cy="0.4" r="0.65">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3AA0FF"/><stop offset=".5" stop-color="#0A84FF"/><stop offset="1" stop-color="#0B3AD1"/>
    </linearGradient>
    <radialGradient id="lb-glow" cx=".5" cy=".36" r=".72">
      <stop offset="0" stop-color="#8FD0FF" stop-opacity=".5"/><stop offset="1" stop-color="#8FD0FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lb-mk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D6E9FF"/>
    </linearGradient>
    <radialGradient id="lb-nd" cx=".42" cy=".38" r=".7">
      <stop offset="0" stop-color="#F0FCFF"/><stop offset=".45" stop-color="#22D3EE"/><stop offset="1" stop-color="#0AACD0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg5)"/>
  <rect width="1200" height="630" fill="url(#glow5)"/>

  <g stroke="#ffffff" stroke-opacity="0.04">
    <path d="M0 105H1200M0 210H1200M0 315H1200M0 420H1200M0 525H1200"/>
    <path d="M150 0V630M300 0V630M450 0V630M600 0V630M750 0V630M900 0V630M1050 0V630"/>
  </g>

  <!-- Mac with terminal window -->
  <g transform="translate(170,150)">
    <rect x="8" y="0" width="330" height="205" rx="12" fill="#0e1a2e" stroke="#3b82f6" stroke-opacity="0.6" stroke-width="2.5"/>
    <rect x="22" y="14" width="302" height="177" rx="8" fill="#0a1120"/>
    <!-- terminal chrome -->
    <circle cx="40" cy="30" r="5" fill="#ef4444" opacity="0.8"/>
    <circle cx="58" cy="30" r="5" fill="#f59e0b" opacity="0.8"/>
    <circle cx="76" cy="30" r="5" fill="#22c55e" opacity="0.8"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" fill="#7dd3fc">
      <text x="38" y="62">$ rclone serve webdav ~/Shared \</text>
      <text x="38" y="82">    --addr :8080 --user pat</text>
      <text x="38" y="108" fill="#4ade80">WebDAV server listening on</text>
      <text x="38" y="128" fill="#4ade80">http://192.168.1.20:8080/</text>
      <text x="38" y="158" fill="#64748b">▌</text>
    </g>
    <path d="M0 207h346l-14 15a11 11 0 0 1-8 4H22a11 11 0 0 1-8-4z" fill="#0b1424" stroke="#3b82f6" stroke-opacity="0.35"/>
  </g>

  <!-- served folder tree floating -->
  <g transform="translate(560,205)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
    <rect x="-14" y="-26" width="150" height="132" rx="10" fill="#0e1a2e" stroke="#3b82f6" stroke-opacity="0.45" stroke-width="1.5"/>
    <text x="0" y="-4" fill="#93c5fd">/Shared</text>
    <text x="10" y="20" fill="#64748b">├─ docs/</text>
    <text x="10" y="44" fill="#64748b">├─ photos/</text>
    <text x="10" y="68" fill="#64748b">├─ music/</text>
    <text x="10" y="92" fill="#64748b">└─ inbox/</text>
  </g>

  <!-- Android phone mounting it -->
  <g transform="translate(830,145)">
    <rect width="150" height="280" rx="22" fill="#0e1c30" stroke="#22c55e" stroke-opacity="0.55" stroke-width="2.5"/>
    <circle cx="75" cy="19" r="4" fill="#14532d" stroke="#22c55e" stroke-opacity="0.4"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5">
      <text x="18" y="56" fill="#86efac">WebDAV · Mac</text>
      <rect x="16" y="70" width="118" height="26" rx="6" fill="#123227"/>
      <text x="26" y="88" fill="#d1fae5">docs/</text>
      <rect x="16" y="102" width="118" height="26" rx="6" fill="#123227"/>
      <text x="26" y="120" fill="#d1fae5">photos/</text>
      <rect x="16" y="134" width="118" height="26" rx="6" fill="#123227"/>
      <text x="26" y="152" fill="#d1fae5">music/</text>
      <rect x="16" y="166" width="118" height="26" rx="6" fill="#123227"/>
      <text x="26" y="184" fill="#d1fae5">inbox/</text>
    </g>
    <text x="75" y="252" text-anchor="middle" font-family="Segoe UI, -apple-system, system-ui, sans-serif" fill="#7fd6a0" font-size="13" font-weight="600">mounted ✓</text>
  </g>

  <!-- connection -->
  <g stroke="#3b82f6" stroke-opacity="0.5" stroke-width="3.5" stroke-dasharray="12 10" stroke-linecap="round">
    <path d="M516 255 L544 255"/>
    <path d="M700 255 L826 255"/>
  </g>

  <g font-family="Segoe UI, -apple-system, system-ui, sans-serif" text-anchor="middle">
    <text x="600" y="525" fill="#ffffff" font-size="38" font-weight="650" letter-spacing="-0.5">Your Mac, as a folder on Android</text>
    <text x="600" y="562" fill="#93a4c8" font-size="20">A WebDAV server in one command — and when you actually want one</text>
  </g>

  <!-- BIShare logo (inlined from public/logo.svg; ids prefixed) + wordmark -->
  <g transform="translate(548,52)" font-family="Segoe UI, -apple-system, system-ui, sans-serif">
    <g transform="scale(0.0664)">
      <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#lb-bg)"/>
      <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#lb-glow)"/>
      <rect x="16" y="16" width="480" height="220" rx="112" fill="#FFFFFF" opacity=".07"/>
      <g fill="none" stroke="url(#lb-mk)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round">
        <path d="M217.1 351.5 L351.5 217.1"/><path d="M316.1 223.3 L351.5 217.1 L345.3 252.6"/>
        <path d="M294.9 160.5 L160.5 294.9"/><path d="M195.9 288.7 L160.5 294.9 L166.7 259.5"/>
      </g>
      <circle cx="256" cy="256" r="18" fill="url(#lb-nd)"/>
    </g>
    <text x="44" y="25" fill="#dbe4f6" font-size="21" font-weight="600">BIShare</text>
  </g>
</svg>
