<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-label="A sixty-second pre-flight checklist before sending a sensitive file: say the recipient, check what the file remembers, decide how long access lasts, check where it lands, choose the shortest route">
  <rect width="1200" height="400" fill="#0a1020"/>
  <g font-family="Segoe UI, -apple-system, system-ui, sans-serif">
    <text x="60" y="56" fill="#e8eefc" font-size="26" font-weight="650">Sixty seconds before you send</text>
    <g font-size="15">
      <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#60a5fa" font-size="14">
        <text x="66" y="128">01</text><text x="66" y="184">02</text><text x="66" y="240">03</text><text x="66" y="296">04</text><text x="66" y="352">05</text>
      </g>
      <text x="120" y="128" fill="#e8eefc" font-weight="600">Say the recipient's name out loud</text>
      <text x="640" y="128" fill="#93a4c8" font-size="14">— beats scanning; stops the wrong-Sarah case</text>
      <text x="120" y="184" fill="#e8eefc" font-weight="600">Ask what the file remembers</text>
      <text x="640" y="184" fill="#93a4c8" font-size="14">— Exif, tracked changes, hidden columns</text>
      <text x="120" y="240" fill="#e8eefc" font-weight="600">Decide how long access lasts</text>
      <text x="640" y="240" fill="#93a4c8" font-size="14">— can't answer? pick the expiring route</text>
      <text x="120" y="296" fill="#e8eefc" font-weight="600">Ask where it lands</text>
      <text x="640" y="296" fill="#93a4c8" font-size="14">— encrypted disk? inside a sync folder?</text>
      <text x="120" y="352" fill="#e8eefc" font-weight="600">Choose the shortest route that works</text>
      <text x="640" y="352" fill="#93a4c8" font-size="14">— same room beats same network beats internet</text>
    </g>
    <path d="M60 96 H1140" stroke="#1e2c48"/>
  </g>
</svg>
