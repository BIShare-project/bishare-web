<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-label="Bar chart comparing per-transfer size ceilings: email 25 MB, chat apps 2 GB, free transfer sites 2 GB, BIShare link 100 GB, and local transfer bounded only by disk">
  <rect width="1200" height="430" fill="#0a1020"/>
  <g font-family="Segoe UI, -apple-system, system-ui, sans-serif">
    <text x="60" y="56" fill="#e8eefc" font-size="26" font-weight="650">How big a file can each route carry?</text>
    <text x="60" y="86" fill="#93a4c8" font-size="15">Per-transfer ceilings on free tiers. Bar length is logarithmic.</text>
    <g font-size="15">
      <text x="60" y="140" fill="#e8eefc">Email attachment</text>
      <rect x="330" y="122" width="70" height="26" rx="5" fill="#64748b" fill-opacity="0.6"/>
      <text x="418" y="141" fill="#93a4c8" font-family="ui-monospace, Menlo, monospace">25 MB</text>

      <text x="60" y="196" fill="#e8eefc">Chat apps</text>
      <rect x="330" y="178" width="300" height="26" rx="5" fill="#64748b" fill-opacity="0.6"/>
      <text x="648" y="197" fill="#93a4c8" font-family="ui-monospace, Menlo, monospace">up to 2 GB · often recompressed</text>

      <text x="60" y="252" fill="#e8eefc">Free transfer sites</text>
      <rect x="330" y="234" width="300" height="26" rx="5" fill="#64748b" fill-opacity="0.6"/>
      <text x="648" y="253" fill="#93a4c8" font-family="ui-monospace, Menlo, monospace">2 GB, then a paywall</text>

      <text x="60" y="308" fill="#e8eefc">BIShare link</text>
      <rect x="330" y="290" width="470" height="26" rx="5" fill="#3b82f6"/>
      <text x="818" y="309" fill="#93c5fd" font-family="ui-monospace, Menlo, monospace">100 GB free</text>

      <text x="60" y="364" fill="#e8eefc">BIShare on your own Wi-Fi</text>
      <rect x="330" y="346" width="740" height="26" rx="5" fill="#22d3ee"/>
      <text x="330" y="400" fill="#7fd6a0" font-family="ui-monospace, Menlo, monospace">no ceiling — bounded by the receiver's free disk space</text>
    </g>
  </g>
</svg>
