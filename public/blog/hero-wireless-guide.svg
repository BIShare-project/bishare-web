<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Wireless file transfer between PCs and mobile devices — the complete guide">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060b19"/>
      <stop offset="1" stop-color="#0d1830"/>
    </linearGradient>
    <radialGradient id="glow4" cx="0.5" cy="0.44" r="0.65">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3AA0FF"/><stop offset=".5" stop-color="#0A84FF"/><stop offset="1" stop-color="#0B3AD1"/>
    </linearGradient>
    <radialGradient id="lb-glow" cx=".5" cy=".36" r=".72">
      <stop offset="0" stop-color="#8FD0FF" stop-opacity=".5"/><stop offset="1" stop-color="#8FD0FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lb-mk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D6E9FF"/>
    </linearGradient>
    <radialGradient id="lb-nd" cx=".42" cy=".38" r=".7">
      <stop offset="0" stop-color="#F0FCFF"/><stop offset=".45" stop-color="#22D3EE"/><stop offset="1" stop-color="#0AACD0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg4)"/>
  <rect width="1200" height="630" fill="url(#glow4)"/>

  <g stroke="#ffffff" stroke-opacity="0.04">
    <path d="M0 105H1200M0 210H1200M0 315H1200M0 420H1200M0 525H1200"/>
    <path d="M150 0V630M300 0V630M450 0V630M600 0V630M750 0V630M900 0V630M1050 0V630"/>
  </g>

  <!-- center hub node -->
  <g transform="translate(600,300)">
    <circle r="46" fill="#0f1e3a" stroke="#3b82f6" stroke-opacity="0.7" stroke-width="2.5"/>
    <circle r="26" fill="#2563eb" fill-opacity="0.18"/>
    <path d="M-16 6 a22 22 0 0 1 32 0 M-9 -2 a12 12 0 0 1 18 0 M0 8 h0" stroke="#60a5fa" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <circle cy="10" r="3.4" fill="#60a5fa"/>
    <circle r="62" fill="none" stroke="#3b82f6" stroke-opacity="0.18" stroke-width="1.5"/>
    <circle r="82" fill="none" stroke="#3b82f6" stroke-opacity="0.09" stroke-width="1.5"/>
  </g>

  <!-- spokes -->
  <g stroke="#3b82f6" stroke-opacity="0.45" stroke-width="3" stroke-dasharray="10 9" stroke-linecap="round">
    <path d="M556 268 L318 172"/>
    <path d="M644 268 L878 168"/>
    <path d="M553 327 L306 452"/>
    <path d="M647 327 L890 455"/>
  </g>
  <g fill="#60a5fa">
    <circle cx="470" cy="234" r="5"/>
    <circle cx="760" cy="220" r="5"/>
    <circle cx="440" cy="386" r="5"/>
    <circle cx="775" cy="393" r="5"/>
  </g>

  <!-- phone (top-left) -->
  <g transform="translate(230,90) rotate(-5)">
    <rect width="110" height="200" rx="20" fill="#101d36" stroke="#3b82f6" stroke-opacity="0.6" stroke-width="2.5"/>
    <rect x="34" y="10" width="42" height="11" rx="5.5" fill="#0a1226"/>
    <rect x="13" y="34" width="84" height="118" rx="9" fill="#15294a"/>
    <rect x="13" y="162" width="60" height="8" rx="4" fill="#1e3a68"/>
  </g>

  <!-- laptop (top-right) -->
  <g transform="translate(830,102) rotate(4)">
    <rect x="8" y="0" width="220" height="132" rx="10" fill="#101d36" stroke="#3b82f6" stroke-opacity="0.6" stroke-width="2.5"/>
    <rect x="20" y="11" width="196" height="110" rx="6" fill="#15294a"/>
    <path d="M0 134h236l-12 14a10 10 0 0 1-8 3H20a10 10 0 0 1-8-3z" fill="#0b1728" stroke="#3b82f6" stroke-opacity="0.35"/>
  </g>

  <!-- desktop tower + monitor (bottom-left) -->
  <g transform="translate(190,430) rotate(3)">
    <rect width="180" height="112" rx="10" fill="#101d36" stroke="#3b82f6" stroke-opacity="0.6" stroke-width="2.5"/>
    <rect x="12" y="10" width="156" height="82" rx="6" fill="#15294a"/>
    <rect x="70" y="112" width="40" height="10" fill="#0b1728"/>
    <rect x="46" y="122" width="88" height="8" rx="4" fill="#0b1728" stroke="#3b82f6" stroke-opacity="0.3"/>
  </g>

  <!-- tablet (bottom-right) -->
  <g transform="translate(830,428) rotate(-4)">
    <rect width="190" height="132" rx="14" fill="#101d36" stroke="#3b82f6" stroke-opacity="0.6" stroke-width="2.5"/>
    <rect x="12" y="11" width="166" height="110" rx="8" fill="#15294a"/>
  </g>

  <g font-family="Segoe UI, -apple-system, system-ui, sans-serif" text-anchor="middle">
    <text x="600" y="540" fill="#ffffff" font-size="38" font-weight="650" letter-spacing="-0.5">Every device. One wireless playbook.</text>
    <text x="600" y="577" fill="#93a4c8" font-size="20">PC ↔ mobile transfer, from physics to practice</text>
  </g>

  <!-- BIShare logo (inlined from public/logo.svg; ids prefixed) + wordmark -->
  <g transform="translate(548,30)" font-family="Segoe UI, -apple-system, system-ui, sans-serif">
    <g transform="scale(0.0664)">
      <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#lb-bg)"/>
      <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#lb-glow)"/>
      <rect x="16" y="16" width="480" height="220" rx="112" fill="#FFFFFF" opacity=".07"/>
      <g fill="none" stroke="url(#lb-mk)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round">
        <path d="M217.1 351.5 L351.5 217.1"/><path d="M316.1 223.3 L351.5 217.1 L345.3 252.6"/>
        <path d="M294.9 160.5 L160.5 294.9"/><path d="M195.9 288.7 L160.5 294.9 L166.7 259.5"/>
      </g>
      <circle cx="256" cy="256" r="18" fill="url(#lb-nd)"/>
    </g>
    <text x="44" y="25" fill="#dbe4f6" font-size="21" font-weight="600">BIShare</text>
  </g>
</svg>
