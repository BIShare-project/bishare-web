<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="Comparison of zipping a folder to disk before uploading versus streaming the archive as it is created">
  <rect width="1200" height="420" fill="#0a1020"/>
  <g font-family="Segoe UI, -apple-system, system-ui, sans-serif">
    <text x="60" y="56" fill="#e8eefc" font-size="26" font-weight="650">Two ways to send a folder</text>
    <text x="60" y="118" fill="#f87171" font-size="16" font-weight="600">Zip first, then upload</text>
    <g font-size="14" font-family="ui-monospace, Menlo, monospace" fill="#93a4c8">
      <rect x="60" y="136" width="200" height="46" rx="8" fill="#131a2c" stroke="#334155"/>
      <text x="160" y="164" text-anchor="middle" fill="#e8eefc">read 40 GB</text>
      <path d="M268 159 h34" stroke="#475569" stroke-width="2"/>
      <rect x="310" y="136" width="230" height="46" rx="8" fill="#131a2c" stroke="#334155"/>
      <text x="425" y="164" text-anchor="middle" fill="#e8eefc">write a 40 GB .zip</text>
      <path d="M548 159 h34" stroke="#475569" stroke-width="2"/>
      <rect x="590" y="136" width="200" height="46" rx="8" fill="#131a2c" stroke="#334155"/>
      <text x="690" y="164" text-anchor="middle" fill="#e8eefc">upload it</text>
      <text x="815" y="164" fill="#f87171">needs 40 GB spare disk · you wait twice</text>
    </g>
    <text x="60" y="258" fill="#7fd6a0" font-size="16" font-weight="600">Stream the archive as it is built</text>
    <g font-size="14" font-family="ui-monospace, Menlo, monospace">
      <rect x="60" y="276" width="730" height="46" rx="8" fill="#0e1a2e" stroke="#22c55e" stroke-opacity="0.5"/>
      <text x="425" y="304" text-anchor="middle" fill="#e8eefc">read → compress → send, one pass, nothing staged on disk</text>
      <text x="815" y="304" fill="#7fd6a0">0 GB extra disk · transfer starts immediately</text>
    </g>
    <text x="60" y="384" fill="#64748b" font-size="14">The receiver gets a normal .zip either way — the difference is entirely on the sending side.</text>
  </g>
</svg>
