<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Wireless file transfer from iPhone to Windows PC">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050a18"/>
      <stop offset="1" stop-color="#0b1530"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.1"/>
      <stop offset="0.5" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0.1"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3AA0FF"/><stop offset=".5" stop-color="#0A84FF"/><stop offset="1" stop-color="#0B3AD1"/>
    </linearGradient>
    <radialGradient id="lb-glow" cx=".5" cy=".36" r=".72">
      <stop offset="0" stop-color="#8FD0FF" stop-opacity=".5"/><stop offset="1" stop-color="#8FD0FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lb-mk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D6E9FF"/>
    </linearGradient>
    <radialGradient id="lb-nd" cx=".42" cy=".38" r=".7">
      <stop offset="0" stop-color="#F0FCFF"/><stop offset=".45" stop-color="#22D3EE"/><stop offset="1" stop-color="#0AACD0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- faint grid -->
  <g stroke="#ffffff" stroke-opacity="0.04">
    <path d="M0 105H1200M0 210H1200M0 315H1200M0 420H1200M0 525H1200"/>
    <path d="M150 0V630M300 0V630M450 0V630M600 0V630M750 0V630M900 0V630M1050 0V630"/>
  </g>

  <!-- iPhone -->
  <g transform="translate(200,175)">
    <rect x="0" y="0" width="150" height="280" rx="26" fill="#0f1a33" stroke="#3b82f6" stroke-opacity="0.55" stroke-width="2.5"/>
    <rect x="48" y="14" width="54" height="14" rx="7" fill="#0a1226" stroke="#3b82f6" stroke-opacity="0.35"/>
    <rect x="18" y="52" width="114" height="76" rx="10" fill="#132449"/>
    <rect x="18" y="140" width="114" height="10" rx="5" fill="#1d3461"/>
    <rect x="18" y="158" width="86" height="10" rx="5" fill="#1d3461"/>
    <circle cx="75" cy="230" r="17" fill="#2563eb"/>
    <path d="M75 222v13m0-13-6 6m6-6 6 6" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Windows PC -->
  <g transform="translate(770,180)">
    <rect x="0" y="0" width="270" height="170" rx="14" fill="#0f1a33" stroke="#3b82f6" stroke-opacity="0.55" stroke-width="2.5"/>
    <rect x="16" y="16" width="238" height="122" rx="8" fill="#132449"/>
    <g transform="translate(107,49)" fill="#3b82f6">
      <rect x="0" y="0" width="26" height="26" rx="3"/>
      <rect x="30" y="0" width="26" height="26" rx="3"/>
      <rect x="0" y="30" width="26" height="26" rx="3"/>
      <rect x="30" y="30" width="26" height="26" rx="3"/>
    </g>
    <rect x="105" y="170" width="60" height="12" fill="#0f1a33"/>
    <rect x="70" y="182" width="130" height="10" rx="5" fill="#0f1a33" stroke="#3b82f6" stroke-opacity="0.3"/>
  </g>

  <!-- transfer beam -->
  <g>
    <path d="M370 300 C 500 230, 640 230, 755 278" stroke="url(#beam)" stroke-width="4" fill="none" stroke-dasharray="14 12" stroke-linecap="round"/>
    <circle cx="470" cy="262" r="7" fill="#3b82f6"/>
    <circle cx="565" cy="248" r="5.5" fill="#60a5fa"/>
    <circle cx="662" cy="253" r="7" fill="#3b82f6"/>
  </g>

  <!-- caption -->
  <g font-family="Segoe UI, -apple-system, system-ui, sans-serif" text-anchor="middle">
    <text x="600" y="520" fill="#ffffff" font-size="40" font-weight="650" letter-spacing="-0.5">iPhone → Windows, no cable</text>
    <text x="600" y="560" fill="#93a4c8" font-size="21">Wireless transfer over your own Wi-Fi · end-to-end encrypted</text>
  </g>

  <!-- BIShare logo (inlined from public/logo.svg; ids prefixed) + wordmark -->
  <g transform="translate(548,62)" font-family="Segoe UI, -apple-system, system-ui, sans-serif">
    <g transform="scale(0.0664)">
      <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#lb-bg)"/>
      <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#lb-glow)"/>
      <rect x="16" y="16" width="480" height="220" rx="112" fill="#FFFFFF" opacity=".07"/>
      <g fill="none" stroke="url(#lb-mk)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round">
        <path d="M217.1 351.5 L351.5 217.1"/><path d="M316.1 223.3 L351.5 217.1 L345.3 252.6"/>
        <path d="M294.9 160.5 L160.5 294.9"/><path d="M195.9 288.7 L160.5 294.9 L166.7 259.5"/>
      </g>
      <circle cx="256" cy="256" r="18" fill="url(#lb-nd)"/>
    </g>
    <text x="44" y="25" fill="#dbe4f6" font-size="21" font-weight="600">BIShare</text>
  </g>
</svg>
