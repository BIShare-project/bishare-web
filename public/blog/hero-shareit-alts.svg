<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="A checklist of the seven jobs a SHAREit replacement must cover, with a lean transfer app on one side and an ad-laden media portal on the other">
  <defs>
    <linearGradient id="bg15" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14"/><stop offset="1" stop-color="#0d1322"/>
    </linearGradient>
    <radialGradient id="glow15" cx="0.5" cy="0.5" r="0.62">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.24"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3AA0FF"/><stop offset=".5" stop-color="#0A84FF"/><stop offset="1" stop-color="#0B3AD1"/>
    </linearGradient>
    <radialGradient id="lb-glow" cx=".5" cy=".36" r=".72">
      <stop offset="0" stop-color="#8FD0FF" stop-opacity=".5"/><stop offset="1" stop-color="#8FD0FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lb-mk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D6E9FF"/>
    </linearGradient>
    <radialGradient id="lb-nd" cx=".42" cy=".38" r=".7">
      <stop offset="0" stop-color="#F0FCFF"/><stop offset=".45" stop-color="#22D3EE"/><stop offset="1" stop-color="#0AACD0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg15)"/>
  <rect width="1200" height="630" fill="url(#glow15)"/>
  <g stroke="#ffffff" stroke-opacity="0.04">
    <path d="M0 105H1200M0 210H1200M0 315H1200M0 420H1200M0 525H1200"/>
    <path d="M150 0V630M300 0V630M450 0V630M600 0V630M750 0V630M900 0V630M1050 0V630"/>
  </g>

  <g font-family="Segoe UI, -apple-system, system-ui, sans-serif">
    <text x="600" y="150" text-anchor="middle" fill="#93a4c8" font-size="17">You are not replacing one feature</text>

    <!-- bloated incumbent -->
    <g transform="translate(150,200)">
      <rect width="360" height="250" rx="18" fill="#160f0c" stroke="#f59e0b" stroke-opacity="0.45" stroke-width="2"/>
      <text x="180" y="46" text-anchor="middle" fill="#fbbf24" font-size="17" font-weight="600">what it became</text>
      <g font-size="14.5" fill="#93a4c8">
        <text x="34" y="92">file transfer</text>
        <text x="34" y="126">+ content feed</text>
        <text x="34" y="160">+ games tab</text>
        <text x="34" y="194">+ ads</text>
        <text x="34" y="228">+ a permission list</text>
      </g>
    </g>

    <!-- the seven jobs -->
    <g transform="translate(660,186)">
      <rect width="400" height="282" rx="18" fill="#0c1830" stroke="#3b82f6" stroke-opacity="0.55" stroke-width="2"/>
      <text x="200" y="44" text-anchor="middle" fill="#93c5fd" font-size="17" font-weight="600">what you actually use</text>
      <g font-size="14.5" fill="#e8eefc">
        <text x="30" y="86">1 · offline transfer</text>
        <text x="30" y="118">2 · Android ↔ iPhone</text>
        <text x="30" y="150">3 · share installed apps</text>
        <text x="30" y="182">4 · group sending</text>
        <text x="30" y="214">5 · receiver without the app</text>
        <text x="30" y="246">6 · no size ceiling</text>
        <text x="30" y="278" fill="#7fd6a0">7 · somewhere it all lands</text>
      </g>
    </g>

    <text x="600" y="540" text-anchor="middle" fill="#ffffff" font-size="37" font-weight="650" letter-spacing="-0.5">Replace the seven jobs, not the app</text>
    <text x="600" y="576" text-anchor="middle" fill="#93a4c8" font-size="19">SHAREit alternatives, judged against what you really use</text>
  </g>

  <!-- BIShare logo (inlined from public/logo.svg; ids prefixed) + wordmark -->
  <g transform="translate(70,44)" font-family="Segoe UI, -apple-system, system-ui, sans-serif">
    <g transform="scale(0.0664)">
      <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#lb-bg)"/>
      <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#lb-glow)"/>
      <rect x="16" y="16" width="480" height="220" rx="112" fill="#FFFFFF" opacity=".07"/>
      <g fill="none" stroke="url(#lb-mk)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round">
        <path d="M217.1 351.5 L351.5 217.1"/><path d="M316.1 223.3 L351.5 217.1 L345.3 252.6"/>
        <path d="M294.9 160.5 L160.5 294.9"/><path d="M195.9 288.7 L160.5 294.9 L166.7 259.5"/>
      </g>
      <circle cx="256" cy="256" r="18" fill="url(#lb-nd)"/>
    </g>
    <text x="44" y="25" fill="#dbe4f6" font-size="21" font-weight="600">BIShare</text>
  </g>
</svg>
