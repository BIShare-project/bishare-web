<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="An itemized mobile data bill for file sharing, with every line reduced to zero by transferring locally">
  <defs>
    <linearGradient id="bg18" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14"/><stop offset="1" stop-color="#0d1322"/>
    </linearGradient>
    <radialGradient id="glow18" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.22"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3AA0FF"/><stop offset=".5" stop-color="#0A84FF"/><stop offset="1" stop-color="#0B3AD1"/>
    </linearGradient>
    <radialGradient id="lb-glow" cx=".5" cy=".36" r=".72">
      <stop offset="0" stop-color="#8FD0FF" stop-opacity=".5"/><stop offset="1" stop-color="#8FD0FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lb-mk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D6E9FF"/>
    </linearGradient>
    <radialGradient id="lb-nd" cx=".42" cy=".38" r=".7">
      <stop offset="0" stop-color="#F0FCFF"/><stop offset=".45" stop-color="#22D3EE"/><stop offset="1" stop-color="#0AACD0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg18)"/>
  <rect width="1200" height="630" fill="url(#glow18)"/>
  <g stroke="#ffffff" stroke-opacity="0.04">
    <path d="M0 105H1200M0 210H1200M0 315H1200M0 420H1200M0 525H1200"/>
    <path d="M150 0V630M300 0V630M450 0V630M600 0V630M750 0V630M900 0V630M1050 0V630"/>
  </g>
  <g font-family="Segoe UI, -apple-system, system-ui, sans-serif">
    <g transform="translate(300,140)">
      <rect width="600" height="330" rx="18" fill="#0c1830" stroke="#3b82f6" stroke-opacity="0.5" stroke-width="2"/>
      <text x="300" y="52" text-anchor="middle" fill="#93c5fd" font-size="17" font-weight="600" letter-spacing="1.5">MOBILE DATA — ITEMIZED</text>
      <path d="M40 70 H560" stroke="#1e2c48"/>
      <g font-size="15.5">
        <text x="40" y="106" fill="#e8eefc">Send one 2 GB video</text>
        <text x="560" y="106" text-anchor="end" fill="#fbbf24" font-family="ui-monospace, Menlo, monospace">4.0 GB</text>
        <text x="40" y="148" fill="#e8eefc">Photo backup you didn't ask for</text>
        <text x="560" y="148" text-anchor="end" fill="#fbbf24" font-family="ui-monospace, Menlo, monospace">1.0 GB</text>
        <text x="40" y="190" fill="#e8eefc">Laptop on your hotspot</text>
        <text x="560" y="190" text-anchor="end" fill="#fbbf24" font-family="ui-monospace, Menlo, monospace">4.0 GB</text>
        <text x="40" y="232" fill="#e8eefc">Same, while roaming</text>
        <text x="560" y="232" text-anchor="end" fill="#f87171" font-family="ui-monospace, Menlo, monospace">billed per MB</text>
      </g>
      <path d="M40 258 H560" stroke="#1e2c48"/>
      <text x="40" y="296" fill="#7fd6a0" font-size="17" font-weight="600">Sent across the room instead</text>
      <text x="560" y="296" text-anchor="end" fill="#7fd6a0" font-size="19" font-weight="700" font-family="ui-monospace, Menlo, monospace">0</text>
    </g>
    <text x="600" y="536" text-anchor="middle" fill="#ffffff" font-size="37" font-weight="650" letter-spacing="-0.5">The bill you didn't know you were paying</text>
    <text x="600" y="574" text-anchor="middle" fill="#93a4c8" font-size="19">Sharing files without spending mobile data</text>
  </g>
  <g transform="translate(70,44)" font-family="Segoe UI, -apple-system, system-ui, sans-serif">
    <g transform="scale(0.0664)">
      <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#lb-bg)"/>
      <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#lb-glow)"/>
      <rect x="16" y="16" width="480" height="220" rx="112" fill="#FFFFFF" opacity=".07"/>
      <g fill="none" stroke="url(#lb-mk)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round">
        <path d="M217.1 351.5 L351.5 217.1"/><path d="M316.1 223.3 L351.5 217.1 L345.3 252.6"/>
        <path d="M294.9 160.5 L160.5 294.9"/><path d="M195.9 288.7 L160.5 294.9 L166.7 259.5"/>
      </g>
      <circle cx="256" cy="256" r="18" fill="url(#lb-nd)"/>
    </g>
    <text x="44" y="25" fill="#dbe4f6" font-size="21" font-weight="600">BIShare</text>
  </g>
</svg>
