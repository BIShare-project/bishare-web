<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-label="Sending one 2 GB video through the cloud bills the sender 2 GB and the receiver 2 GB, while the same transfer across local Wi-Fi costs nothing on either side">
  <rect width="1200" height="440" fill="#0a1020"/>
  <g font-family="Segoe UI, -apple-system, system-ui, sans-serif">
    <text x="60" y="54" fill="#e8eefc" font-size="26" font-weight="650">One 2 GB video, two bills</text>
    <text x="60" y="84" fill="#93a4c8" font-size="15">Cloud transfers meter both ends — and neither person sees the other half.</text>

    <text x="60" y="140" fill="#fbbf24" font-size="16" font-weight="600">Through the cloud</text>
    <g font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <rect x="60" y="158" width="150" height="46" rx="8" fill="#131a2c" stroke="#334155"/>
      <text x="135" y="186" text-anchor="middle" fill="#e8eefc">your phone</text>
      <path d="M216 181 h96" stroke="#f59e0b" stroke-width="3"/>
      <text x="264" y="170" text-anchor="middle" fill="#fbbf24" font-size="13">2 GB up</text>
      <rect x="318" y="158" width="180" height="46" rx="8" fill="#1a1410" stroke="#f59e0b" stroke-opacity="0.6"/>
      <text x="408" y="186" text-anchor="middle" fill="#fbbf24">data centre</text>
      <path d="M504 181 h96" stroke="#f59e0b" stroke-width="3"/>
      <text x="552" y="170" text-anchor="middle" fill="#fbbf24" font-size="13">2 GB down</text>
      <rect x="606" y="158" width="150" height="46" rx="8" fill="#131a2c" stroke="#334155"/>
      <text x="681" y="186" text-anchor="middle" fill="#e8eefc">their phone</text>
      <text x="790" y="186" fill="#f87171" font-size="15" font-family="Segoe UI, sans-serif">4 GB of combined allowance</text>
    </g>

    <text x="60" y="272" fill="#7fd6a0" font-size="16" font-weight="600">Across the room</text>
    <g font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <rect x="60" y="290" width="150" height="46" rx="8" fill="#131a2c" stroke="#334155"/>
      <text x="135" y="318" text-anchor="middle" fill="#e8eefc">your phone</text>
      <path d="M216 313 h390" stroke="#22c55e" stroke-width="3"/>
      <text x="411" y="302" text-anchor="middle" fill="#7fd6a0" font-size="13">your router · not metered</text>
      <rect x="606" y="290" width="150" height="46" rx="8" fill="#131a2c" stroke="#334155"/>
      <text x="681" y="318" text-anchor="middle" fill="#e8eefc">their phone</text>
      <text x="790" y="318" fill="#7fd6a0" font-size="15" font-family="Segoe UI, sans-serif">0 — nothing crossed the meter</text>
    </g>

    <text x="60" y="400" fill="#64748b" font-size="14">The meter exists only where your network meets the internet. A transfer that never reaches that edge is never counted.</text>
  </g>
</svg>
