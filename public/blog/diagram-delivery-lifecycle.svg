<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-label="The lifecycle of a client video delivery: prepare, send with resumable upload, confirm receipt, then expire">
  <rect width="1200" height="380" fill="#0a1020"/>
  <g font-family="Segoe UI, -apple-system, system-ui, sans-serif">
    <text x="60" y="56" fill="#e8eefc" font-size="26" font-weight="650">A delivery has four stages, not one</text>
    <path d="M110 190 H1090" stroke="#1e2c48" stroke-width="3"/>
    <g font-size="15">
      <circle cx="150" cy="190" r="14" fill="#0e1a2e" stroke="#60a5fa" stroke-width="3"/>
      <text x="150" y="150" text-anchor="middle" fill="#e8eefc" font-weight="600">Prepare</text>
      <text x="150" y="238" text-anchor="middle" fill="#93a4c8" font-size="14">name it, strip what</text>
      <text x="150" y="258" text-anchor="middle" fill="#93a4c8" font-size="14">shouldn't travel</text>

      <circle cx="460" cy="190" r="14" fill="#0e1a2e" stroke="#60a5fa" stroke-width="3"/>
      <text x="460" y="150" text-anchor="middle" fill="#e8eefc" font-weight="600">Send</text>
      <text x="460" y="238" text-anchor="middle" fill="#93a4c8" font-size="14">resumable — a dropped</text>
      <text x="460" y="258" text-anchor="middle" fill="#93a4c8" font-size="14">Wi-Fi resumes, not restarts</text>

      <circle cx="770" cy="190" r="14" fill="#0e1a2e" stroke="#60a5fa" stroke-width="3"/>
      <text x="770" y="150" text-anchor="middle" fill="#e8eefc" font-weight="600">Confirm</text>
      <text x="770" y="238" text-anchor="middle" fill="#93a4c8" font-size="14">know it was opened,</text>
      <text x="770" y="258" text-anchor="middle" fill="#93a4c8" font-size="14">not just sent</text>

      <circle cx="1060" cy="190" r="14" fill="#0e1a2e" stroke="#22d3ee" stroke-width="3"/>
      <text x="1060" y="150" text-anchor="middle" fill="#e8eefc" font-weight="600">Expire</text>
      <text x="1060" y="238" text-anchor="middle" fill="#7fd6a0" font-size="14">access ends on a timer,</text>
      <text x="1060" y="258" text-anchor="middle" fill="#7fd6a0" font-size="14">not on good intentions</text>
    </g>
    <text x="60" y="330" fill="#64748b" font-size="14">Most tools cover only the second stage. The other three are where client deliveries actually go wrong.</text>
  </g>
</svg>
