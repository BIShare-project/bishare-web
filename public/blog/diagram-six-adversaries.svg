<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="Six points where a confidential document can be exposed: the network, the server, the link, the endpoint device, the recipient, and everyday habit">
  <rect width="1200" height="420" fill="#0a1020"/>
  <g font-family="Segoe UI, -apple-system, system-ui, sans-serif">
    <text x="60" y="56" fill="#e8eefc" font-size="26" font-weight="650">Six places a confidential document is exposed</text>
    <path d="M110 240 H1090" stroke="#1e2c48" stroke-width="3"/>
    <g font-size="15" text-anchor="middle">
      <g fill="#f59e0b">
        <circle cx="150" cy="240" r="9"/><circle cx="336" cy="240" r="9"/><circle cx="522" cy="240" r="9"/>
        <circle cx="708" cy="240" r="9"/><circle cx="894" cy="240" r="9"/><circle cx="1060" cy="240" r="9"/>
      </g>
      <text x="150" y="200" fill="#e8eefc" font-weight="600">Network</text>
      <text x="150" y="286" fill="#93a4c8" font-size="14">hostile Wi-Fi,</text><text x="150" y="306" fill="#93a4c8" font-size="14">TLS middleboxes</text>
      <text x="336" y="200" fill="#e8eefc" font-weight="600">Server</text>
      <text x="336" y="286" fill="#93a4c8" font-size="14">scanning, backups,</text><text x="336" y="306" fill="#93a4c8" font-size="14">breach radius</text>
      <text x="522" y="200" fill="#e8eefc" font-weight="600">Link</text>
      <text x="522" y="286" fill="#93a4c8" font-size="14">forwarded, pasted,</text><text x="522" y="306" fill="#93a4c8" font-size="14">never expires</text>
      <text x="708" y="200" fill="#e8eefc" font-weight="600">Device</text>
      <text x="708" y="286" fill="#93a4c8" font-size="14">lost laptop,</text><text x="708" y="306" fill="#93a4c8" font-size="14">forgotten copies</text>
      <text x="894" y="200" fill="#e8eefc" font-weight="600">Recipient</text>
      <text x="894" y="286" fill="#93a4c8" font-size="14">the wrong David,</text><text x="894" y="306" fill="#93a4c8" font-size="14">reply-all</text>
      <text x="1060" y="200" fill="#e8eefc" font-weight="600">Habit</text>
      <text x="1060" y="286" fill="#93a4c8" font-size="14">personal email</text><text x="1060" y="306" fill="#93a4c8" font-size="14">"just this once"</text>
    </g>
    <text x="60" y="372" fill="#64748b" font-size="14">Encryption removes the first two outright. The last four are decisions, not cryptography.</text>
  </g>
</svg>
