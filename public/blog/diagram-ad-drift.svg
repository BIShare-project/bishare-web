<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-label="How a free transfer utility drifts into an ad platform: useful tool, mass adoption, running costs with no revenue, then a banner, a content feed and a games tab">
  <rect width="1200" height="440" fill="#0a1020"/>
  <g font-family="Segoe UI, -apple-system, system-ui, sans-serif">
    <text x="60" y="54" fill="#e8eefc" font-size="26" font-weight="650">How a clean utility becomes an ad platform</text>
    <text x="60" y="84" fill="#93a4c8" font-size="15">Nobody decides this in one meeting. Each step is individually defensible.</text>
    <path d="M110 200 H1090" stroke="#1e2c48" stroke-width="3"/>
    <g font-size="14.5" text-anchor="middle">
      <circle cx="150" cy="200" r="11" fill="#0e1a2e" stroke="#22c55e" stroke-width="3"/>
      <text x="150" y="168" fill="#7fd6a0" font-weight="600">useful tool</text>
      <text x="150" y="238" fill="#64748b" font-size="13">does one job well</text>

      <circle cx="380" cy="200" r="11" fill="#0e1a2e" stroke="#60a5fa" stroke-width="3"/>
      <text x="380" y="168" fill="#93c5fd" font-weight="600">mass adoption</text>
      <text x="380" y="238" fill="#64748b" font-size="13">hundreds of millions</text>

      <circle cx="610" cy="200" r="11" fill="#0e1a2e" stroke="#f59e0b" stroke-width="3"/>
      <text x="610" y="168" fill="#fbbf24" font-weight="600">costs, no revenue</text>
      <text x="610" y="238" fill="#64748b" font-size="13">servers · team · support</text>

      <circle cx="840" cy="200" r="11" fill="#1a1410" stroke="#f59e0b" stroke-width="3"/>
      <text x="840" y="168" fill="#fbbf24" font-weight="600">one modest banner</text>
      <text x="840" y="238" fill="#64748b" font-size="13">"just to cover hosting"</text>

      <circle cx="1060" cy="200" r="11" fill="#1a1410" stroke="#ef4444" stroke-width="3"/>
      <text x="1060" y="168" fill="#f87171" font-weight="600">media portal</text>
      <text x="1060" y="238" fill="#64748b" font-size="13">feed · games · transfer tab</text>
    </g>
    <path d="M60 300 H1140" stroke="#1e2c48"/>
    <text x="60" y="338" fill="#93c5fd" font-size="16" font-weight="600">The question that predicts the ending</text>
    <text x="60" y="370" fill="#e8eefc" font-size="15">Not "does it have ads?" but "what happens to this app when it needs money?"</text>
    <text x="60" y="404" fill="#64748b" font-size="14">An app whose free path costs its makers nothing to run has no step three.</text>
  </g>
</svg>
