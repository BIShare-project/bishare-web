<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Sharing files instantly between an iPhone and an Android phone">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070d1d"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="beam3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.12"/>
      <stop offset="0.5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0.14"/>
    </linearGradient>
    <radialGradient id="glow3" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.27"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3AA0FF"/><stop offset=".5" stop-color="#0A84FF"/><stop offset="1" stop-color="#0B3AD1"/>
    </linearGradient>
    <radialGradient id="lb-glow" cx=".5" cy=".36" r=".72">
      <stop offset="0" stop-color="#8FD0FF" stop-opacity=".5"/><stop offset="1" stop-color="#8FD0FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lb-mk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D6E9FF"/>
    </linearGradient>
    <radialGradient id="lb-nd" cx=".42" cy=".38" r=".7">
      <stop offset="0" stop-color="#F0FCFF"/><stop offset=".45" stop-color="#22D3EE"/><stop offset="1" stop-color="#0AACD0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg3)"/>
  <rect width="1200" height="630" fill="url(#glow3)"/>

  <g stroke="#ffffff" stroke-opacity="0.04">
    <path d="M0 105H1200M0 210H1200M0 315H1200M0 420H1200M0 525H1200"/>
    <path d="M150 0V630M300 0V630M450 0V630M600 0V630M750 0V630M900 0V630M1050 0V630"/>
  </g>

  <!-- iPhone (left, tilted in) -->
  <g transform="translate(250,180) rotate(6)">
    <rect x="0" y="0" width="145" height="270" rx="26" fill="#101d36" stroke="#3b82f6" stroke-opacity="0.6" stroke-width="2.5"/>
    <rect x="46" y="13" width="52" height="13" rx="6.5" fill="#0a1226" stroke="#3b82f6" stroke-opacity="0.35"/>
    <rect x="16" y="46" width="113" height="92" rx="10" fill="#15294a"/>
    <g transform="translate(52,72)" fill="#60a5fa">
      <rect x="0" y="0" width="18" height="18" rx="4"/>
      <rect x="22" y="0" width="18" height="18" rx="4" opacity="0.7"/>
      <rect x="0" y="22" width="18" height="18" rx="4" opacity="0.7"/>
      <rect x="22" y="22" width="18" height="18" rx="4" opacity="0.45"/>
    </g>
    <rect x="16" y="150" width="113" height="9" rx="4.5" fill="#1e3a68"/>
    <rect x="16" y="167" width="80" height="9" rx="4.5" fill="#1e3a68"/>
    <text x="72" y="245" text-anchor="middle" font-family="Segoe UI, -apple-system, system-ui, sans-serif" fill="#8fb4ec" font-size="14" font-weight="600">iPhone</text>
  </g>

  <!-- Android (right, tilted in) -->
  <g transform="translate(805,180) rotate(-6)">
    <rect x="0" y="0" width="145" height="270" rx="20" fill="#0e1e2e" stroke="#22c55e" stroke-opacity="0.6" stroke-width="2.5"/>
    <circle cx="72" cy="19" r="4" fill="#14532d" stroke="#22c55e" stroke-opacity="0.4"/>
    <rect x="16" y="40" width="113" height="98" rx="10" fill="#123227"/>
    <g transform="translate(52,68)" fill="#4ade80">
      <circle cx="9" cy="9" r="9"/>
      <circle cx="34" cy="9" r="9" opacity="0.7"/>
      <circle cx="9" cy="34" r="9" opacity="0.7"/>
      <circle cx="34" cy="34" r="9" opacity="0.45"/>
    </g>
    <rect x="16" y="150" width="113" height="9" rx="4.5" fill="#1c4634"/>
    <rect x="16" y="167" width="80" height="9" rx="4.5" fill="#1c4634"/>
    <text x="72" y="245" text-anchor="middle" font-family="Segoe UI, -apple-system, system-ui, sans-serif" fill="#86e0a8" font-size="14" font-weight="600">Android</text>
  </g>

  <!-- beam both directions -->
  <g>
    <path d="M405 290 C 505 235, 695 235, 795 290" stroke="url(#beam3)" stroke-width="4" fill="none" stroke-dasharray="14 12" stroke-linecap="round"/>
    <path d="M405 330 C 505 385, 695 385, 795 330" stroke="url(#beam3)" stroke-width="4" fill="none" stroke-dasharray="14 12" stroke-linecap="round" opacity="0.7"/>
    <circle cx="510" cy="253" r="6.5" fill="#60a5fa"/>
    <circle cx="600" cy="244" r="5.5" fill="#93c5fd"/>
    <circle cx="690" cy="253" r="6.5" fill="#4ade80"/>
    <circle cx="600" cy="371" r="5.5" fill="#4ade80" opacity="0.8"/>
  </g>

  <g font-family="Segoe UI, -apple-system, system-ui, sans-serif" text-anchor="middle">
    <text x="600" y="520" fill="#ffffff" font-size="40" font-weight="650" letter-spacing="-0.5">iPhone ↔ Android, instantly</text>
    <text x="600" y="560" fill="#93a4c8" font-size="21">The bridge Apple and Google never built</text>
  </g>

  <!-- BIShare logo (inlined from public/logo.svg; ids prefixed) + wordmark -->
  <g transform="translate(548,62)" font-family="Segoe UI, -apple-system, system-ui, sans-serif">
    <g transform="scale(0.0664)">
      <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#lb-bg)"/>
      <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#lb-glow)"/>
      <rect x="16" y="16" width="480" height="220" rx="112" fill="#FFFFFF" opacity=".07"/>
      <g fill="none" stroke="url(#lb-mk)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round">
        <path d="M217.1 351.5 L351.5 217.1"/><path d="M316.1 223.3 L351.5 217.1 L345.3 252.6"/>
        <path d="M294.9 160.5 L160.5 294.9"/><path d="M195.9 288.7 L160.5 294.9 L166.7 259.5"/>
      </g>
      <circle cx="256" cy="256" r="18" fill="url(#lb-nd)"/>
    </g>
    <text x="44" y="25" fill="#dbe4f6" font-size="21" font-weight="600">BIShare</text>
  </g>
</svg>
