<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-label="A matrix of phone and computer combinations showing which built-in transfer tool works, and where only a cross-platform app does">
  <rect width="1200" height="400" fill="#0a1020"/>
  <g font-family="Segoe UI, -apple-system, system-ui, sans-serif">
    <text x="60" y="56" fill="#e8eefc" font-size="26" font-weight="650">Which built-in tool covers your pair?</text>
    <g font-size="15">
      <text x="430" y="118" text-anchor="middle" fill="#93a4c8">Windows PC</text>
      <text x="700" y="118" text-anchor="middle" fill="#93a4c8">Mac</text>
      <text x="960" y="118" text-anchor="middle" fill="#93a4c8">Linux</text>
      <text x="70" y="185" fill="#e8eefc" font-weight="600">iPhone</text>
      <text x="70" y="265" fill="#e8eefc" font-weight="600">Android</text>
      <text x="70" y="345" fill="#93c5fd" font-weight="600">Either, with BIShare</text>
    </g>
    <g stroke="#1e2c48" stroke-width="1">
      <path d="M60 140 H1140 M60 215 H1140 M60 295 H1140"/>
    </g>
    <g font-size="15" text-anchor="middle">
      <text x="430" y="185" fill="#f87171">none</text>
      <text x="700" y="185" fill="#7fd6a0">AirDrop</text>
      <text x="960" y="185" fill="#f87171">none</text>
      <text x="430" y="265" fill="#7fd6a0">Quick Share</text>
      <text x="700" y="265" fill="#f87171">none</text>
      <text x="960" y="265" fill="#f87171">none</text>
      <text x="430" y="345" fill="#93c5fd">✓</text>
      <text x="700" y="345" fill="#93c5fd">✓</text>
      <text x="960" y="345" fill="#93c5fd">✓</text>
    </g>
    <text x="60" y="382" fill="#64748b" font-size="14">Four of the six everyday combinations have no built-in answer at all.</text>
  </g>
</svg>
