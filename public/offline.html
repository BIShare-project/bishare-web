<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#030711" />
    <title>Offline · BIShare</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100vh;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #030711;
        color: #fafafa;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        max-width: 26rem;
        padding: 2rem;
        text-align: center;
      }
      .eyebrow {
        margin: 0;
        font-size: 0.75rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #3b82f6;
        font-weight: 600;
      }
      h1 {
        margin: 0.75rem 0 0;
        font-size: 1.6rem;
        line-height: 1.15;
        letter-spacing: -0.02em;
        font-weight: 600;
      }
      p {
        margin: 0.75rem 0 0;
        font-size: 0.95rem;
        line-height: 1.6;
        color: #a1a1aa;
      }
      button {
        margin-top: 1.75rem;
        padding: 0.65rem 1.4rem;
        border: 0;
        border-radius: 0.6rem;
        background: #fafafa;
        color: #030711;
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Offline</p>
      <h1>You’re offline</h1>
      <p>
        BIShare needs a connection to send and receive files. Check your network
        and try again.
      </p>
      <button onclick="location.reload()">Retry</button>
    </main>
  </body>
</html>
