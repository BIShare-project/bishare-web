name: Deploy to Cloudflare

on:
  push:
    branches: [main]

concurrency:
  group: bishare-web-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy production Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Validate deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$CLOUDFLARE_D1_DATABASE_ID" || { echo "Missing CLOUDFLARE_D1_DATABASE_ID"; exit 1; }

      - name: Create production Wrangler config
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";

          const config = {
            name: "bishare-web",
            main: "worker/index.ts",
            compatibility_date: "2026-06-01",
            compatibility_flags: ["nodejs_compat"],
            workers_dev: true,
            routes: [
              { pattern: "bishare.app", custom_domain: true },
              { pattern: "www.bishare.app", custom_domain: true },
            ],
            assets: { directory: ".open-next/assets", binding: "ASSETS" },
            d1_databases: [
              {
                binding: "DB",
                database_name: "bishare-cloud",
                database_id: process.env.CLOUDFLARE_D1_DATABASE_ID,
              },
            ],
            r2_buckets: [{ binding: "BUCKET", bucket_name: "bishare-cloud" }],
            durable_objects: {
              bindings: [{ name: "STATS_LIVE_DO", class_name: "StatsLiveDO" }],
            },
            migrations: [{ tag: "v1", new_sqlite_classes: ["StatsLiveDO"] }],
            vars: {
              BASE_URL: "https://bishare.app",
              R2_BUCKET_NAME: "bishare-cloud",
              R2_PUBLIC_URL: "https://cdn.bishare.app",
            },
            observability: { enabled: true },
          };

          writeFileSync("wrangler.web.jsonc", `${JSON.stringify(config, null, 2)}\n`);
          NODE

      - name: Build Cloudflare Worker
        env:
          NEXT_PUBLIC_API_URL: https://api.bishare.app
        run: npm run build:cloudflare

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy -c wrangler.web.jsonc
